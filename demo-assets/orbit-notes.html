:root{--accent:#9382d0}body{background:#f3f1fa;color:#49405f;padding:25px;min-height:100vh}main{max-width:1100px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;padding-bottom:22px;border-bottom:1px solid #ddd7eb}.brand{font-size:21px;font-weight:650;letter-spacing:-.7px;display:flex;align-items:center;gap:10px}.mark{height:25px;width:25px;border:1px solid #9b8bbe;border-radius:50%;transform:rotate(-30deg);position:relative}.mark:after{content:'';position:absolute;inset:6px -5px;border:1px solid #9b8bbe;border-radius:50%}.mark:before{content:'';position:absolute;left:9px;top:9px;width:5px;height:5px;background:#8672b8;border-radius:50%}.top small{font-size:9px;color:#9a8db4;letter-spacing:1.6px}.intro{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:26px}.intro h1{font:35px Georgia,serif;letter-spacing:-1.1px}.intro p{font-size:11px;color:#998aaf;margin-top:8px}.primary{background:#8771b4;color:#fffaff;border-radius:7px;padding:12px 16px;font-size:11px;white-space:nowrap}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:25px}.filters{display:flex;gap:6px}.filter{background:none;color:#a298b2;font-size:10px;padding:7px 11px;border-radius:15px}.filter[aria-pressed=true]{background:#e0d8ef;color:#6d598e}.search{width:170px;border:1px solid #ddd6e9;border-radius:6px;background:#faf8fe;color:#695880;padding:8px 11px;font-size:10px}.orbit-board{position:relative;height:470px;max-width:860px;margin:auto;overflow:hidden}.orbits{width:100%;height:100%;position:absolute;inset:0;pointer-events:none}.orbits ellipse{fill:none;stroke:#dcd5e9;stroke-width:1;stroke-dasharray:3 5}.orbits .inner{stroke-dasharray:none;stroke:#e4deee}.topic{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);height:126px;width:126px;border-radius:50%;background:#e6def3;border:1px solid #d1c4e6;color:#746091;padding:18px;box-shadow:0 0 0 13px #e9e2f333;z-index:1}.topic span{display:block;font-size:8px;letter-spacing:1.4px;text-transform:uppercase;color:#aa97c1;margin-bottom:7px}.topic strong{font:19px/1.12 Georgia,serif;display:block;overflow-wrap:anywhere}.note{position:absolute;width:163px;min-height:107px;border-radius:8px;padding:14px;text-align:left;background:var(--card-bg,#fffafd);border:1px solid var(--card-border,#e2d8ef);box-shadow:0 4px 8px #57487505;transform:translate(-50%,-50%);color:#5c4d70;z-index:2}.note .group{font-size:8px;color:var(--card-text,#9b83b5);letter-spacing:1.1px;text-transform:uppercase;display:flex;gap:6px;align-items:center;margin-bottom:8px}.note .group:before{content:'';display:block;width:4px;height:4px;background:currentColor;border-radius:50%}.note strong{display:block;font-size:12px;font-weight:600;line-height:1.35}.note p{font-size:10px;line-height:1.5;color:#9d90a9;margin-top:6px;overflow-wrap:anywhere}.note:hover{border-color:#b4a1cd}.empty-orbit{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);font-size:11px;color:#ac9bbd;text-align:center}.bottom{display:flex;align-items:center;justify-content:space-between;gap:12px;border-top:1px solid #ddd7e9;padding-top:15px;font-size:9px;color:#a294b3;line-height:1.6}.bottom-controls{display:flex;gap:13px;align-items:center}.text-button{padding:0;background:none;font-size:9px;color:#9b8bab;text-decoration:underline}.pager{display:flex;align-items:center;gap:10px;font-size:9px}.pager button{width:25px;height:25px;border:1px solid #d9d0e6;border-radius:50%;background:#ede7f6;color:#8c77a5}.list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:18px 0}.list[hidden],.orbit-board[hidden]{display:none}.list-card{background:#faf8fd;border:1px solid #ded5e9;padding:14px;border-radius:8px;color:#6d5d81;text-align:left}.list-card small{display:block;color:#ae9dbe;font-size:8px;text-transform:uppercase;letter-spacing:1px;margin-bottom:7px}.list-card strong{font-size:12px;display:block}.list-card p{font-size:10px;line-height:1.6;color:#9c8aaa;margin-top:5px;white-space:pre-wrap;overflow-wrap:anywhere}.topic-mobile{display:none}.footnote{font-size:9px;color:#ac9eb8;margin-top:12px}dialog{color:#685479;background:#f9f6fe;border:1px solid #d9cce7;border-radius:14px;padding:25px;width:min(420px,calc(100% - 28px));box-shadow:0 15px 80px #33204433}dialog::backdrop{background:#40305166}dialog h2{font:26px Georgia,serif;margin-bottom:18px}.field{display:block;font-size:10px;color:#9b85ad;margin-top:12px}.field input,.field textarea,.field select{display:block;width:100%;border:1px solid #ddcee9;padding:10px;border-radius:5px;background:#fffaff;color:#614774;margin-top:5px;font-size:12px}.field textarea{resize:vertical;min-height:110px}.dialog-actions{display:flex;gap:10px;align-items:center;margin-top:22px}.secondary{padding:10px;background:#eae2f2;border-radius:5px;font-size:11px;color:#8a739f}.delete{margin-left:auto;background:none;font-size:11px;color:#ab7388}@media(max-width:780px){body{padding:18px 12px}.top small{font-size:8px;letter-spacing:1px}.orbit-board{height:430px}.note{width:140px;padding:12px;min-height:100px}.note strong{font-size:11px}.note p{font-size:9px}.topic{width:108px;height:108px;padding:14px}.topic strong{font-size:17px}}@media(max-width:620px){.intro h1{font-size:28px}.intro p{font-size:10px}.primary{font-size:10px;padding:10px 12px}.toolbar{flex-wrap:wrap;gap:12px}.filters{gap:3px}.filter{padding:7px 9px}.search{width:100%}.orbit-board{display:none}.list{display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr))}.topic-mobile{display:block;text-align:left;background:#e4daef;border:1px solid #d4c5e2;border-radius:10px;padding:15px;margin-top:17px;color:#8b719f;width:100%;font-size:10px}.topic-mobile strong{display:block;font:23px Georgia,serif;color:#705981;margin-top:5px}.bottom{flex-wrap:wrap}.bottom-controls{margin-left:auto}#view-toggle,.pager{display:none}.top small{max-width:110px;text-align:right;line-height:1.5}}</style></head><body>
<main><header class="top"><div class="brand"><span class="mark" aria-hidden="true"></span>orbit notes</div><small>GOOD IDEAS NEED A LITTLE SPACE</small></header><section class="intro"><div><h1>Let your thoughts wander.</h1><p>A place for ideas that aren't quite ready to be a plan.</p></div><button class="primary" id="add">+ A new thought</button></section><div class="toolbar"><nav class="filters" aria-label="Filter notes by orbit"><button class="filter" data-group="all" aria-pressed="true">All orbits</button><button class="filter" data-group="spark" aria-pressed="false">Spark</button><button class="filter" data-group="explore" aria-pressed="false">Explore</button><button class="filter" data-group="shape" aria-pressed="false">Shape</button></nav><input class="search" id="search" type="search" placeholder="Find a thought…" aria-label="Search notes"></div><button class="topic-mobile" id="topic-mobile">YOUR CENTRAL THOUGHT · TAP TO EDIT<strong></strong></button><div class="orbit-board" id="orbit-board"><svg class="orbits" viewBox="0 0 860 470" preserveAspectRatio="none" aria-hidden="true"><ellipse cx="430" cy="235" rx="285" ry="173"></ellipse><ellipse class="inner" cx="430" cy="235" rx="195" ry="116"></ellipse><ellipse cx="430" cy="235" rx="100" ry="71"></ellipse></svg><button class="topic" id="topic"><span>At the center</span><strong></strong></button><div id="notes"></div></div><div class="list" id="list" aria-label="All matching notes as a text list" hidden></div><footer class="bottom"><span id="status" role="status"></span><div class="pager"><button id="previous" aria-label="Previous notes">←</button><span id="page-label"></span><button id="next" aria-label="Next notes">→</button></div><div class="bottom-controls"><button class="text-button" id="view-toggle">Use text list</button><button class="text-button" id="reset">Reset sample</button></div></footer><p class="footnote">A sample constellation · Edits live only in this session · Open any thought to edit or delete it.</p></main><dialog id="editor"><form id="note-form"><h2 id="editor-heading">Catch a thought.</h2><label class="field">Title<input id="note-title" required maxlength="65" autocomplete="off"></label><div id="note-fields"><label class="field">Thought<textarea id="note-body" maxlength="600"></textarea></label><label class="field">Orbit<select id="note-group"><option value="spark">Spark — the beginning of something</option><option value="explore">Explore — follow the thread</option><option value="shape">Shape — give it a direction</option></select></label></div><div class="dialog-actions"><button class="primary" type="button" id="save-thought">Save thought</button><button class="secondary" id="cancel" type="button">Cancel</button><button class="delete" id="delete" type="button">Delete</button></div></form></dialog><script>'use strict';

const initial=[{id:1,title:'What if it felt like Sunday?',body:'Slow mornings. Warm light. Nothing in a hurry.',group:'spark'},{id:2,title:'Collect the little things',body:'A paper receipt, a color on a walk, a half-remembered song.',group:'explore'},{id:3,title:'Less, but with feeling',body:'Make every small detail earn its place.',group:'shape'},{id:4,title:'A sound you can almost touch',body:'Soft textures, a little tape warmth, space between the notes.',group:'spark'},{id:5,title:'Follow the unexpected',body:'Look outside the usual places. Take the longer way home.',group:'explore'},{id:6,title:'Leave something unfinished',body:'A little room for someone else to find themselves in it.',group:'shape'}];
const colors={spark:['#fcf4ef','#ebdcd3','#c29980'],explore:['#f3f6ef','#dde4d1','#91a27d'],shape:['#f6f1fd','#e2d7ed','#ad94c0']};let notes=initial.map(n=>({...n})),topic='A softer kind of creative life',group='all',editing=null,nextId=7,page=0,listMode=false;
const dialog=document.querySelector('#editor');function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e;}
function matches(){const q=document.querySelector('#search').value.trim().toLowerCase();return notes.filter(n=>(group==='all'||group===n.group)&&`${n.title} ${n.body}`.toLowerCase().includes(q));}
function render(){const results=matches(),pages=Math.max(1,Math.ceil(results.length/6));page=Math.max(0,Math.min(page,pages-1));document.querySelector('#topic strong').textContent=topic;document.querySelector('#topic-mobile strong').textContent=topic;const container=document.querySelector('#notes'),list=document.querySelector('#list');container.replaceChildren();list.replaceChildren();const shown=results.slice(page*6,page*6+6);shown.forEach((n,i)=>{const angle=(-90+i*60)*Math.PI/180,card=el('button','note'),c=colors[n.group];card.style.left=(50+Math.cos(angle)*34)+'%';card.style.top=(50+Math.sin(angle)*35)+'%';card.style.setProperty('--card-bg',c[0]);card.style.setProperty('--card-border',c[1]);card.style.setProperty('--card-text',c[2]);card.setAttribute('aria-label',`Edit ${n.title}, ${n.group} orbit`);card.append(el('span','group',n.group),el('strong','',n.title),el('p','',n.body.length>75?n.body.slice(0,72)+'…':n.body));card.onclick=()=>openEditor(n.id);container.append(card);});results.forEach(n=>{const card=el('button','list-card');card.append(el('small','',n.group+' orbit'),el('strong','',n.title),el('p','',n.body));card.onclick=()=>openEditor(n.id);card.setAttribute('aria-label',`Edit ${n.title}, ${n.group} orbit`);list.append(card);});if(!results.length){container.append(el('p','empty-orbit','No thoughts here yet. Leave a little spark.'));list.append(el('p','footnote','No matching thoughts.'));}document.querySelector('#status').textContent=`${notes.length} thought${notes.length===1?'':'s'} · ${new Set(notes.map(n=>n.group)).size} orbits · ${results.length} in view`;document.querySelector('#page-label').textContent=`${page+1} / ${pages}`;document.querySelector('#previous').disabled=page===0;document.querySelector('#next').disabled=page===pages-1;document.querySelector('#orbit-board').hidden=listMode;list.hidden=!listMode;document.querySelector('#view-toggle').textContent=listMode?'Use orbit view':'Use text list';}
function openEditor(id=null){editing=id;const isTopic=id==='topic',n=notes.find(n=>n.id===id)||{title:'',body:'',group:'spark'};document.querySelector('#editor-heading').textContent=isTopic?'At the center.':id?'Follow that thought.':'Catch a thought.';document.querySelector('#note-title').value=isTopic?topic:n.title;document.querySelector('#note-title').maxLength=isTopic?65:65;document.querySelector('#note-body').value=n.body;document.querySelector('#note-group').value=n.group;document.querySelector('#note-fields').hidden=isTopic;document.querySelector('#delete').hidden=!id||isTopic;dialog.showModal();document.querySelector('#note-title').focus();}
function saveThought(){if(!document.querySelector('#note-form').reportValidity())return;const title=document.querySelector('#note-title').value.trim();if(!title)return;if(editing==='topic')topic=title;else{const n={id:editing||nextId++,title,body:document.querySelector('#note-body').value.trim(),group:document.querySelector('#note-group').value};if(editing)notes=notes.map(x=>x.id===editing?n:x);else{notes.push(n);group='all';document.querySelector('#search').value='';document.querySelectorAll('[data-group]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.group==='all'));page=Math.floor((notes.length-1)/6);}}dialog.close();render();}document.querySelector('#save-thought').onclick=saveThought;document.querySelector('#note-form').onkeydown=e=>{if(e.key==='Enter'&&e.target.tagName==='INPUT'){e.preventDefault();saveThought();}};document.querySelector('#cancel').onclick=()=>dialog.close();document.querySelector('#delete').onclick=()=>{notes=notes.filter(n=>n.id!==editing);dialog.close();render();};document.querySelector('#add').onclick=()=>openEditor();document.querySelector('#topic').onclick=()=>openEditor('topic');document.querySelector('#topic-mobile').onclick=()=>openEditor('topic');document.querySelectorAll('[data-group]').forEach(b=>b.onclick=()=>{group=b.dataset.group;page=0;document.querySelectorAll('[data-group]').forEach(x=>x.setAttribute('aria-pressed',x===b));render();});document.querySelector('#search').oninput=()=>{page=0;render();};document.querySelector('#previous').onclick=()=>{page--;render();};document.querySelector('#next').onclick=()=>{page++;render();};document.querySelector('#view-toggle').onclick=()=>{listMode=!listMode;render();};document.querySelector('#reset').onclick=()=>{notes=initial.map(n=>({...n}));topic='A softer kind of creative life';nextId=7;page=0;group='all';document.querySelector('#search').value='';document.querySelectorAll('[data-group]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.group==='all'));render();};render();
window.parent.postMessage({type:'pls-demo-ready'}, '*');</script></body></html>
