<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'"><title>Tempo Lab — Pocket sequencer</title><style>*{box-sizing:border-box}html{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{margin:0}button,input,select,textarea{font:inherit}button,select{cursor:pointer}button{touch-action:manipulation}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--accent,#e17848);outline-offset:3px}button:disabled{cursor:not-allowed;opacity:.45}h1,h2,h3,p{margin:0}button{border:0}input,select,textarea{max-width:100%}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

:root{--accent:#80e2cd}body{background:#102723;color:#e2f3e8;min-height:100vh;padding:30px}main{max-width:980px;margin:auto}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:32px}.logo{display:flex;gap:12px;align-items:center}.logo-icon{display:grid;grid-template-columns:repeat(3,5px);align-items:center;gap:3px;height:30px}.logo-icon i{background:#98e9c8;height:20px;border-radius:2px}.logo-icon i:nth-child(2){height:30px}h1{font-size:21px;letter-spacing:-.7px}.eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:2px;color:#87aaa0;margin-top:5px}.badge{border:1px solid #36594e;padding:7px 10px;border-radius:20px;font-size:10px;color:#9fc2b4}.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:24px}.hero h2{font-size:clamp(25px,4vw,39px);font-weight:500;letter-spacing:-1.6px}.hero p{font-size:12px;color:#9db6aa;margin-top:9px}.bpm{font-size:38px;font-weight:500;letter-spacing:-2px;white-space:nowrap}.bpm small{font-size:10px;letter-spacing:1px;color:#91b3a5;margin-left:6px}.rack{background:#17362e;border:1px solid #305044;border-radius:16px;padding:22px}.rack-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:22px}.patterns{display:flex;gap:5px;align-items:center}.label{font-size:10px;letter-spacing:1.3px;text-transform:uppercase;color:#90b3a4;margin-right:9px}.patterns button{background:#234639;color:#9bbba8;width:32px;height:30px;border-radius:5px}.patterns button[aria-pressed=true]{background:#b6e9ac;color:#163525}.select{background:#234639;color:#c4dacb;border:1px solid #436150;border-radius:6px;padding:7px;font-size:11px}.sequencer{display:grid;gap:11px}.row{display:grid;grid-template-columns:72px repeat(16,minmax(0,1fr));gap:5px;align-items:center}.track{font-size:11px;font-weight:600;display:flex;align-items:center;gap:7px}.track i{width:5px;height:5px;background:var(--track);border-radius:50%}.step{height:45px;background:#27493b;border:1px solid #335745;border-radius:5px;position:relative}.step:nth-child(4n+2){margin-left:3px}.step[aria-pressed=true]{background:var(--track);border-color:var(--track);box-shadow:inset 0 -3px 0 #0002}.step.current::after{content:'';position:absolute;inset:-4px;border:1px solid #e4f7ca;border-radius:7px}.numbers{display:grid;grid-template-columns:72px repeat(16,minmax(0,1fr));gap:5px;font-size:8px;color:#749784;text-align:center;margin-top:11px}.controls{display:flex;align-items:center;gap:16px;margin-top:24px;padding-top:20px;border-top:1px solid #335143}.play{background:#c4efa8;color:#173924;padding:13px 25px;border-radius:7px;font-weight:700;font-size:12px;min-width:104px}.control{display:flex;align-items:center;gap:10px;flex:1}.control input{accent-color:#bce9a6;width:100%;min-width:30px}.control span{font-size:10px;color:#9abcaa}.clear{color:#a3c1b0;background:transparent;font-size:11px;padding:10px}.foot{display:flex;justify-content:space-between;gap:16px;margin-top:20px;color:#799a8a;font-size:10px;line-height:1.6}.status{color:#b0cbbd;min-height:16px}.step-editor{display:none}.mini{display:flex;gap:3px;align-items:flex-end;height:16px}.mini i{width:3px;background:#a8d198;height:5px}.mini i:nth-child(2){height:13px}.mini i:nth-child(3){height:9px}@media(max-width:600px){body{padding:18px 12px}.top{margin-bottom:28px}.badge{display:none}.rack{padding:16px 10px}.hero{align-items:center}.bpm{font-size:30px}.row{grid-template-columns:44px repeat(16,minmax(0,1fr));gap:3px}.track{font-size:9px;gap:4px}.step{height:35px;border-radius:3px}.step:nth-child(4n+2){margin-left:1px}.numbers{grid-template-columns:44px repeat(16,minmax(0,1fr));gap:3px}.controls{flex-wrap:wrap;gap:12px}.control{min-width:100px}.volume{display:none}.rack-top{gap:6px}.label{font-size:8px;margin-right:3px}.select{max-width:124px}.play{padding:12px 18px;min-width:92px}.foot{font-size:9px}.hero p{font-size:11px}.step-editor{display:flex;gap:7px;align-items:center;margin-top:16px}.step-editor select{min-width:0;background:#234639;color:#c4dacb;border:1px solid #436150;border-radius:5px;padding:8px;font-size:10px}.step-editor button{background:#406047;color:#dfebd2;border-radius:5px;padding:9px;font-size:10px}.step-editor span{font-size:9px;color:#94b5a2}}</style></head><body>
<main><header class="top"><div class="logo"><span class="logo-icon" aria-hidden="true"><i></i><i></i><i></i></span><div><h1>tempo lab</h1><p class="eyebrow">Your pocket groovebox</p></div></div><span class="badge">16 STEPS · INFINITE POSSIBILITIES</span></header><section class="hero"><div><h2>Find your rhythm.</h2><p>A little structure. A lot of room to play.</p></div><div class="bpm"><output id="bpm">108</output><small>BPM</small></div></section><section class="rack" aria-label="Step sequencer"><div class="rack-top"><div class="patterns"><span class="label">Pattern</span><button data-pattern="0" aria-pressed="true">A</button><button data-pattern="1" aria-pressed="false">B</button></div><label><span class="sr-only">Load a preset</span><select class="select" id="preset"><option value="night">Late-night pocket</option><option value="break">Broken sunlight</option><option value="house">Greenhouse house</option></select></label></div><div class="sequencer" id="grid"></div><div class="numbers" aria-hidden="true"><span></span></div><div class="controls"><button class="play" id="play">▶ Play</button><label class="control"><span>Tempo</span><input id="tempo" aria-label="Tempo in beats per minute" type="range" min="70" max="160" value="108"></label><label class="control volume"><span>Level</span><input id="volume" aria-label="Volume" type="range" min="0" max="100" value="65"></label><button class="clear" id="clear">Clear pattern</button></div><div class="step-editor"><span>Edit</span><select id="edit-track" aria-label="Track to edit"><option value="0">Kick</option><option value="1">Snare</option><option value="2">Hat</option><option value="3">Keys</option></select><select id="edit-step" aria-label="Step to edit"></select><button id="toggle-step">Toggle step</button></div></section><footer class="foot"><div><p class="status" id="status" role="status">Ready when you are. Press Play to hear your pattern.</p><p>Tap a step to make it yours · Arrow keys move between steps</p></div><div class="mini" aria-hidden="true"><i></i><i></i><i></i><i></i></div></footer></main><script>'use strict';

const tracks=[{name:'Kick',color:'#b9df8d'},{name:'Snare',color:'#e7b27f'},{name:'Hat',color:'#7ec9b2'},{name:'Keys',color:'#beb0df'}];
const presets={night:[[0,6,8,11],[4,12],[0,2,4,6,8,10,12,14],[0,7,10]],break:[[0,3,8,10],[4,11,12],[0,2,3,6,8,10,14,15],[0,6,12]],house:[[0,4,8,12],[4,12],[2,6,10,14],[0,4,10,14]]};
let patterns=[],activePattern=0,playing=false,ctx=null,master=null,timer=null,step=0,nextTime=0,visualTimers=[];
const grid=document.querySelector('#grid'),status=document.querySelector('#status');
function loadPreset(name){const p=presets[name];patterns=[p.map(a=>Array.from({length:16},(_,i)=>a.includes(i))),p.map((a,t)=>Array.from({length:16},(_,i)=>a.includes((i+(t===3?2:0))%16)))];render();}
function render(){grid.replaceChildren();tracks.forEach((t,r)=>{const row=document.createElement('div');row.className='row';row.style.setProperty('--track',t.color);const label=document.createElement('span');label.className='track';const dot=document.createElement('i');label.append(dot,document.createTextNode(t.name));row.append(label);for(let s=0;s<16;s++){const b=document.createElement('button');b.className='step';b.dataset.row=r;b.dataset.step=s;b.setAttribute('aria-label',`${t.name}, step ${s+1}`);b.setAttribute('aria-pressed',patterns[activePattern][r][s]);b.onclick=()=>{patterns[activePattern][r][s]=!patterns[activePattern][r][s];b.setAttribute('aria-pressed',patterns[activePattern][r][s]);};b.onkeydown=e=>{const delta={ArrowRight:1,ArrowLeft:-1,ArrowDown:16,ArrowUp:-16}[e.key];if(delta!==undefined){e.preventDefault();const i=(r*16+s+delta+64)%64;grid.querySelectorAll('.step')[i].focus();}};row.append(b);}grid.append(row);});}
function voice(track,time){const gain=ctx.createGain();gain.connect(master);if(track===1||track===2){const buffer=ctx.createBuffer(1,ctx.sampleRate*.2,ctx.sampleRate);const data=buffer.getChannelData(0);for(let i=0;i<data.length;i++)data[i]=Math.random()*2-1;const source=ctx.createBufferSource();source.buffer=buffer;const filter=ctx.createBiquadFilter();filter.type='highpass';filter.frequency.value=track===1?1200:6500;source.connect(filter);filter.connect(gain);gain.gain.setValueAtTime(track===1?.23:.1,time);gain.gain.exponentialRampToValueAtTime(.001,time+(track===1?.16:.045));source.start(time);source.stop(time+.2);source.onended=()=>{source.disconnect();filter.disconnect();gain.disconnect();};}else{const osc=ctx.createOscillator();osc.type=track===0?'sine':'triangle';osc.frequency.setValueAtTime(track===0?130:[261.63,311.13,392,466.16][Math.floor(step/4)],time);if(track===0)osc.frequency.exponentialRampToValueAtTime(42,time+.13);osc.connect(gain);gain.gain.setValueAtTime(.001,time);gain.gain.exponentialRampToValueAtTime(track===0?.7:.1,time+.006);gain.gain.exponentialRampToValueAtTime(.001,time+(track===0?.2:.28));osc.start(time);osc.stop(time+.3);osc.onended=()=>{osc.disconnect();gain.disconnect();};}}
function schedule(){while(nextTime<ctx.currentTime+.10){const s=step;patterns[activePattern].forEach((row,t)=>{if(row[s])voice(t,nextTime);});const id=setTimeout(()=>{if(!playing)return;grid.querySelectorAll('.current').forEach(b=>b.classList.remove('current'));grid.querySelectorAll(`[data-step="${s}"]`).forEach(b=>b.classList.add('current'));},Math.max(0,(nextTime-ctx.currentTime)*1000));visualTimers.push(id);if(visualTimers.length>32)visualTimers.shift();nextTime+=60/Number(document.querySelector('#tempo').value)/4;step=(step+1)%16;}}
function stop(){playing=false;clearInterval(timer);visualTimers.forEach(clearTimeout);visualTimers=[];if(master)master.gain.setValueAtTime(0,ctx.currentTime);grid.querySelectorAll('.current').forEach(b=>b.classList.remove('current'));document.querySelector('#play').textContent='▶ Play';status.textContent='Stopped. Your pattern is ready for another spin.';}
document.querySelector('#play').onclick=async()=>{if(playing){stop();return;}const button=document.querySelector('#play');button.disabled=true;try{const Audio=window.AudioContext||window.webkitAudioContext;if(!Audio)throw Error('Web Audio is unavailable');if(!ctx){ctx=new Audio();master=ctx.createGain();master.connect(ctx.destination);}await ctx.resume();master.gain.setValueAtTime(Number(document.querySelector('#volume').value)/100,ctx.currentTime);playing=true;step=0;nextTime=ctx.currentTime+.05;schedule();timer=setInterval(schedule,25);button.textContent='■ Stop';status.textContent='Playing. Build your pattern while it loops.';}catch(e){status.textContent='Audio could not start in this browser. Step editing still works.';}finally{button.disabled=false;}};
document.querySelectorAll('[data-pattern]').forEach(b=>b.onclick=()=>{activePattern=Number(b.dataset.pattern);document.querySelectorAll('[data-pattern]').forEach(x=>x.setAttribute('aria-pressed',x===b));render();status.textContent=`Pattern ${activePattern?'B':'A'} selected${playing?' — playing on the next step.':'.'}`;});
document.querySelector('#tempo').oninput=e=>document.querySelector('#bpm').value=e.target.value;
document.querySelector('#volume').oninput=e=>{if(master&&playing)master.gain.setTargetAtTime(Number(e.target.value)/100,ctx.currentTime,.02);};
document.querySelector('#clear').onclick=()=>{patterns[activePattern]=tracks.map(()=>Array(16).fill(false));render();status.textContent=`Pattern ${activePattern?'B':'A'} cleared. Add some steps.`;};
document.querySelector('#preset').onchange=e=>{loadPreset(e.target.value);status.textContent='Preset loaded into both patterns.';};
for(let i=1;i<=16;i++){const option=document.createElement('option');option.value=i-1;option.textContent='Step '+i;document.querySelector('#edit-step').append(option);}document.querySelector('#toggle-step').onclick=()=>{const r=Number(document.querySelector('#edit-track').value),s=Number(document.querySelector('#edit-step').value);patterns[activePattern][r][s]=!patterns[activePattern][r][s];render();status.textContent=`${tracks[r].name}, step ${s+1}: ${patterns[activePattern][r][s]?'on':'off'}.`;};for(let i=1;i<=16;i++){const n=document.createElement('span');n.textContent=String(i).padStart(2,'0');document.querySelector('.numbers').append(n);}document.addEventListener('visibilitychange',()=>{if(document.hidden&&playing)stop();});loadPreset('night');
window.parent.postMessage({type:'pls-demo-ready'}, '*');</script></body></html>
